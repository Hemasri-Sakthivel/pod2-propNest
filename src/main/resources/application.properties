# ── Application ──────────────────────────────────────
spring.application.name=propNest
# Force servlet web stack so Spring Security uses servlet (not reactive) autoconfig,
# even though spring-boot-starter-webflux is on the classpath.
spring.main.web-application-type=servlet
 
# ── Server ───────────────────────────────────────────
server.port=8085
 
# ── MySQL Database ────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/propnest_maintenance?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 
# ── JPA / Hibernate ───────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Use @Column names verbatim (camelCase) instead of converting to snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
 
# ── JSON Response ─────────────────────────────────────
