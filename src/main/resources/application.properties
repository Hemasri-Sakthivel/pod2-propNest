spring.application.name=propNest

# ---------------------------------------------------------------------------
# Web / server
# Base URL for IAM endpoints: http://localhost:8082/propNest/IAM/...
# context-path provides the /propNest prefix; controllers add the /IAM/... part.
# ---------------------------------------------------------------------------
server.port=8083
server.servlet.context-path=/propNest
spring.main.web-application-type=servlet

# ---------------------------------------------------------------------------
# Datasource (MySQL)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/propnest?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# JWT
# accessToken: 30 minutes ; refreshToken: 7 days (server-side, stored in DB)
# Override propnest.jwt.secret in production (Base64-encoded, >= 256 bits).
# ---------------------------------------------------------------------------
propnest.jwt.secret=Y2hhbmdlLXRoaXMtc2VjcmV0LWtleS1mb3ItcHJvcG5lc3QtaWFtLWp3dC1zaWduaW5nLTI1Ng==
propnest.jwt.access-token-expiry-ms=1800000
propnest.jwt.refresh-token-expiry-ms=604800000
propnest.jwt.issuer=propNest-IAM
