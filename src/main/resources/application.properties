spring.application.name=propNest
 
# ── Server ───────────────────────────────────────────
server.port=8089
 
# ── MySQL Database ────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/propnest_tenant?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 
# ── JPA / Hibernate ───────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
 
# ── JSON Response ─────────────────────────────────────
#spring.jackson.serialization.write-dates-as-timestamps=false

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# ── JWT / Security ────────────────────────────────────
# Base64-encoded 256-bit secret used to sign & verify JWTs. Replace with your own
# in real deployments (e.g. generate: openssl rand -base64 32).
jwt.secret=cropNestDevSecretChangeMe0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ=
# Token validity in milliseconds (3600000 = 1 hour).
jwt.expiration-ms=3600000

# ── KYC Document Storage ──────────────────────────────
# Root folder where uploaded KYC documents are stored. By default this is a
# folder in the project working directory (visible in VS Code, and persists
# across restarts). The folder (and per-tenant sub-folders) are created
# automatically at upload time. When deployed as a WAR you can override this
# with an absolute path on the Tomcat server, e.g. ${catalina.base}/propnest-kyc-documents
propnest.kyc.storage.base-dir=./propnest-kyc-documents
# Maximum size of a single document (bytes). 5 MB.
propnest.kyc.max-file-size-bytes=5242880
# Maximum number of documents a single tenant may upload.
propnest.kyc.max-documents-per-tenant=10
# Total storage capacity of the portal across all tenants (bytes). 500 MB.
propnest.kyc.max-total-capacity-bytes=524288000

# ── Multipart upload limits (container-level guard) ───
spring.servlet.multipart.enabled=true
# Kept above propnest.kyc.max-file-size-bytes so the application can return a
# friendly message for oversized files instead of the container hard-rejecting.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB