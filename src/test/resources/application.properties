# Test datasource. No embedded DB (H2) is available in this environment, so the
# repository (@DataJpaTest) and context tests run against the real MySQL.
# ddl-auto=none: the schema is owned by the SQL script; @DataJpaTest wraps each
# test in a transaction and rolls it back, so no test data is persisted.
spring.datasource.url=jdbc:mysql://localhost:3306/propnest_property?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
